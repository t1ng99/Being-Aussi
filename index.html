<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Salary+</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
      padding-bottom: 90px;
    }

    .header {
      background: #111;
      color: white;
      padding: 45px 20px 28px;
      border-radius: 0 0 28px 28px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .settings {
      font-size: 22px;
    }

    .main-pay {
      margin-top: 10px;
    }

    .label {
      font-size: 14px;
      opacity: 0.65;
      margin-bottom: 7px;
    }

    .amount {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .tax-note {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.6;
    }

    .container {
      padding: 20px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 750;
      margin: 8px 0 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .card-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 750;
    }

    .card-small {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .quick-button {
      border: none;
      background: white;
      border-radius: 18px;
      padding: 17px 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .quick-icon {
      font-size: 24px;
      display: block;
      margin-bottom: 7px;
    }

    .progress-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress {
      height: 10px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 35%;
      background: #111;
      border-radius: 20px;
    }

    .goal-info {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 76px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(15px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #eee;
      z-index: 10;
    }

    .nav-item {
      border: none;
      background: transparent;
      font-size: 11px;
      color: #888;
      padding-top: 10px;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #111;
      font-weight: 700;
    }

    @media (min-width: 700px) {
      .container,
      .header {
        max-width: 700px;
        margin: auto;
      }

      .header {
        border-radius: 0 0 28px 28px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-top">
      <div>
        <div class="logo">Salary+</div>
        <div class="subtitle">Australia Finance Manager</div>
      </div>

      <div class="settings">⚙️</div>
    </div>

    <div class="main-pay">
      <div class="label">本月預估收入</div>
      <div class="amount">$3,850</div>
      <div class="tax-note">稅前收入 · FY 2026–27</div>
    </div>
  </header>

  <main class="container">

    <div class="section-title">收入概覽</div>

    <div class="cards">

      <div class="card">
        <div class="card-label">今日收入</div>
        <div class="card-value">$240</div>
        <div class="card-small">8 小時</div>
      </div>

      <div class="card">
        <div class="card-label">本週收入</div>
        <div class="card-value">$1,080</div>
        <div class="card-small">稅前</div>
      </div>

      <div class="card">
        <div class="card-label">本月收入</div>
        <div class="card-value">$3,850</div>
        <div class="card-small">稅前</div>
      </div>

      <div class="card">
        <div class="card-label">本月稅後</div>
        <div class="card-value">$3,272</div>
        <div class="card-small">預估</div>
      </div>

    </div>

    <div class="section-title" style="margin-top:28px;">
      快速新增
    </div>

    <div class="quick">

      <button class="quick-button">
        <span class="quick-icon">📅</span>
        新增工作
      </button>

      <button class="quick-button">
        <span class="quick-icon">💰</span>
        新增收入
      </button>

      <button class="quick-button">
        <span class="quick-icon">🧾</span>
        新增支出
      </button>

    </div>

    <div class="section-title" style="margin-top:28px;">
      存錢目標
    </div>

    <div class="progress-card">

      <div class="progress-top">
        <strong>🚗 我的目標</strong>
        <strong>35%</strong>
      </div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

      <div class="goal-info">
        <span>$7,000 / $20,000</span>
        <span>預估完成：2027</span>
      </div>

    </div>

    <div class="section-title" style="margin-top:28px;">
      財政年度
    </div>

    <div class="card">
      <div class="card-label">2026/07/01 – 2027/06/30</div>
      <div class="card-value">$12,480</div>
      <div class="card-small">
        FY 累積收入 · 稅前
      </div>
    </div>

  </main>

  <nav class="nav">

    <button class="nav-item active">
      <span class="nav-icon">🏠</span>
      首頁
    </button>

    <button class="nav-item">
      <span class="nav-icon">📅</span>
      排班
    </button>

    <button class="nav-item">
      <span class="nav-icon">🧾</span>
      記帳
    </button>

    <button class="nav-item">
      <span class="nav-icon">📊</span>
      統計
    </button>

  </nav>

</body>
</html>
