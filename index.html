<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Salary+</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f10;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
              "SF Pro Display","Helvetica Neue",
              Arial,sans-serif;
}

button,
input,
select{
  font-family:inherit;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:25px 16px 100px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:32px;
  font-weight:800;
}

.header-date{
  color:#888;
  font-size:13px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:#1c1c1e;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
}

.card-title{
  color:#999;
  font-size:13px;
  margin-bottom:7px;
}

.big-money{
  font-size:32px;
  font-weight:800;
}

.green{
  color:#4cd964;
}

.red{
  color:#ff453a;
}

.gray{
  color:#999;
}

.summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.summary-grid .card{
  margin-bottom:0;
}

.small-money{
  font-size:22px;
  font-weight:700;
}

.progress{
  width:100%;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0 8px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#fff;
  border-radius:10px;
  transition:.3s;
}

.button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#fff;
  color:#000;
}

.secondary{
  background:#2c2c2e;
  color:#fff;
}

.danger{
  background:#3a2020;
  color:#ff6b6b;
}

.button:active{
  transform:scale(.98);
}

.section-title{
  font-size:25px;
  font-weight:800;
  margin:10px 0 15px;
}

.work-item,
.expense-item{
  padding:15px 0;
  border-top:1px solid #333;
}

.work-item:first-child,
.expense-item:first-child{
  border-top:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.item-title{
  font-weight:700;
}

.item-sub{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

.item-money{
  font-weight:700;
  white-space:nowrap;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.small-button{
  border:0;
  border-radius:10px;
  padding:8px 11px;
  background:#2c2c2e;
  color:#fff;
  cursor:pointer;
}

.small-button.delete{
  color:#ff6b6b;
  background:#302020;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px 0;
}

.stat-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #292929;
}

.stat-row:last-child{
  border-bottom:0;
}

.stat-label{
  color:#999;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  background:rgba(25,25,27,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid #333;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:20;
}

.nav-button{
  border:0;
  background:transparent;
  color:#777;
  padding:7px 2px;
  font-size:11px;
  cursor:pointer;
}

.nav-button.active{
  color:#fff;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

/* Modal */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  max-height:92vh;
  overflow:auto;
  background:#1c1c1e;
  border-radius:25px 25px 0 0;
  padding:22px 18px 30px;
}

.modal-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:18px;
}

label{
  display:block;
  color:#999;
  font-size:13px;
  margin:12px 0 6px;
}

input,
select{
  width:100%;
  border:0;
  border-radius:12px;
  background:#2c2c2e;
  color:#fff;
  padding:13px;
  font-size:16px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

/* settings */

.setting-row{
  padding:15px 0;
  border-bottom:1px solid #333;
}

.setting-label{
  color:#999;
  font-size:13px;
  margin-bottom:7px;
}

</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <div class="logo">Salary+</div>
    <div class="header-date" id="headerDate"></div>
  </div>
</header>


<!-- HOME -->

<section id="home" class="section active">

  <div class="card">
    <div class="card-title">本月收入</div>
    <div class="big-money" id="monthIncome">$0.00</div>
  </div>

  <div class="summary-grid">

    <div class="card">
      <div class="card-title">今日</div>
      <div class="small-money" id="todayIncome">$0.00</div>
    </div>

    <div class="card">
      <div class="card-title">本週</div>
      <div class="small-money" id="weekIncome">$0.00</div>
    </div>

    <div class="card">
      <div class="card-title">本財政年度</div>
      <div class="small-money" id="fyIncome">$0.00</div>
    </div>

    <div class="card">
      <div class="card-title">總工作時數</div>
      <div class="small-money" id="totalHours">0 h</div>
    </div>

  </div>

  <br>

  <button class="button primary"
          onclick="openWorkModal()">
    ➕ 新增工作
  </button>

  <br><br>

  <div class="card">

    <div class="card-title">
      本財政年度預估
    </div>

    <div class="stat-row">
      <span class="stat-label">稅前收入</span>
      <span id="taxGross">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">預估稅額</span>
      <span id="taxAmount" class="red">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">預估稅後</span>
      <span id="taxNet" class="green">$0.00</span>
    </div>

  </div>


  <div class="card">

    <div class="card-title">
      🏦 儲蓄目標
    </div>

    <div id="savingText">
      尚未設定目標
    </div>

    <div class="progress">
      <div class="progress-bar"
           id="savingProgress"></div>
    </div>

    <div class="stat-row">
      <span class="stat-label">目前存款</span>
      <span id="currentSaving">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">目標</span>
      <span id="savingGoal">$0.00</span>
    </div>

  </div>

</section>


<!-- WORK -->

<section id="work" class="section">

  <div class="section-title">
    📅 工作紀錄
  </div>

  <button class="button primary"
          onclick="openWorkModal()">
    ➕ 新增工作
  </button>

  <br><br>

  <div class="card">
    <div id="workList"></div>
  </div>

</section>


<!-- BOOKKEEPING -->

<section id="bookkeeping" class="section">

  <div class="section-title">
    🧾 記帳
  </div>

  <button class="button primary"
          onclick="openExpenseModal()">
    ➕ 新增支出
  </button>

  <br><br>

  <div class="card">

    <div class="card-title">
      本月支出
    </div>

    <div class="big-money red"
         id="monthExpense">
      $0.00
    </div>

  </div>

  <div class="card">

    <div id="expenseList"></div>

  </div>

</section>


<!-- STATISTICS -->

<section id="statistics" class="section">

  <div class="section-title">
    📊 統計
  </div>

  <div class="card">

    <div class="card-title">
      本財政年度收入
    </div>

    <div class="big-money"
         id="statsIncome">
      $0.00
    </div>

    <div class="stat-row">
      <span class="stat-label">白工</span>
      <span id="whiteIncome">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">現金工作</span>
      <span id="cashIncome">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">工作天數</span>
      <span id="workDays">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">平均時薪</span>
      <span id="averageRate">$0.00</span>
    </div>

  </div>


  <div class="card">

    <div class="card-title">
      本月收支
    </div>

    <div class="stat-row">
      <span class="stat-label">收入</span>
      <span id="statsMonthIncome">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">支出</span>
      <span id="statsMonthExpense">$0.00</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">剩餘</span>
      <span id="statsMonthBalance"
            class="green">
        $0.00
      </span>
    </div>

  </div>


  <div class="card">

    <div class="card-title">
      ⚙️ 設定
    </div>

    <div class="setting-row">

      <div class="setting-label">
        儲蓄目標 AUD
      </div>

      <input
        type="number"
        id="settingGoal"
        placeholder="例如 20000"
      >

    </div>

    <div class="setting-row">

      <div class="setting-label">
        目前存款 AUD
      </div>

      <input
        type="number"
        id="settingSaving"
        placeholder="例如 5000"
      >

    </div>

    <button
      class="button primary"
      style="margin-top:15px"
      onclick="saveSettings()">

      儲存設定

    </button>

  </div>

</section>


</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-button active"
          onclick="showSection('home',this)">
    <span class="nav-icon">🏠</span>
    首頁
  </button>

  <button class="nav-button"
          onclick="showSection('work',this)">
    <span class="nav-icon">📅</span>
    工作
  </button>

  <button class="nav-button"
          onclick="showSection('bookkeeping',this)">
    <span class="nav-icon">🧾</span>
    記帳
  </button>

  <button class="nav-button"
          onclick="showSection('statistics',this)">
    <span class="nav-icon">📊</span>
    統計
  </button>

</nav>


<!-- WORK MODAL -->

<div class="modal" id="workModal">

<div class="modal-box">

  <div class="modal-title"
       id="workModalTitle">
    新增工作
  </div>

  <label>日期</label>
  <input type="date" id="workDate">

  <label>上班時間</label>
  <input type="time" id="workStart">

  <label>下班時間</label>
  <input type="time" id="workEnd">

  <label>休息時間（分鐘）</label>
  <input type="number
