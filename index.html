<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary+</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

body.dark {
  background: #111827;
  color: #f9fafb;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 600px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 90px;
}

.header {
  padding: 24px 18px 10px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  margin: 6px 0 0;
  color: #6b7280;
}

.dark .header p {
  color: #9ca3af;
}

.section {
  padding: 10px 16px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

.dark .card {
  background: #1f2937;
  box-shadow: none;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  background: white;
  border-radius: 18px;
  padding: 16px;
}

.dark .stat {
  background: #1f2937;
}

.label {
  font-size: 13px;
  color: #6b7280;
}

.dark .label {
  color: #9ca3af;
}

.value {
  font-size: 22px;
  font-weight: 800;
  margin-top: 5px;
}

.big-number {
  font-size: 30px;
  font-weight: 800;
}

.card-title {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 8px;
}

.dark .card-title {
  color: #9ca3af;
}

.primary {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 14px;
  margin-top: 8px;
  background: #111827;
  color: white;
  font-weight: 700;
}

.secondary {
  border: 0;
  border-radius: 12px;
  padding: 10px 13px;
  background: #e5e7eb;
  color: #111827;
  font-weight: 600;
}

.dark .secondary {
  background: #374151;
  color: white;
}

.danger {
  border: 0;
  border-radius: 12px;
  padding: 10px 13px;
  background: #fee2e2;
  color: #b91c1c;
  font-weight: 600;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.work-item,
.expense-item {
  padding: 14px 0;
  border-bottom: 1px solid #e5e7eb;
}

.dark .work-item,
.dark .expense-item {
  border-color: #374151;
}

.work-item:last-child,
.expense-item:last-child {
  border-bottom: 0;
}

.work-date {
  font-weight: 800;
}

.work-sub {
  margin-top: 5px;
  color: #6b7280;
  font-size: 13px;
}

.dark .work-sub {
  color: #9ca3af;
}

.amount {
  font-weight: 800;
  white-space: nowrap;
}

.white-work {
  color: #2563eb;
}

.cash-work {
  color: #16a34a;
}

.positive {
  color: #16a34a;
}

.negative {
  color: #dc2626;
}

.empty {
  text-align: center;
  padding: 25px 10px;
  color: #6b7280;
}

.small {
  font-size: 12px;
  color: #6b7280;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  background: white;
  color: #111827;
  outline: none;
}

.dark input,
.dark select,
.dark textarea {
  background: #111827;
  color: white;
  border-color: #4b5563;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 24px 24px 0 0;
  padding: 20px;
  padding-bottom: 30px;
}

.dark .modal-box {
  background: #1f2937;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.modal-header h2 {
  margin: 0;
}

.close {
  border: 0;
  background: #e5e7eb;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 20px;
}

.dark .close {
  background: #374151;
  color: white;
}

.progress {
  height: 12px;
  border-radius: 20px;
  background: #e5e7eb;
  overflow: hidden;
}

.dark .progress {
  background: #374151;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #111827;
  border-radius: 20px;
}

.dark .progress-bar {
  background: white;
}

.add-button {
  position: fixed;
  right: 20px;
  bottom: 85px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 0;
  background: #111827;
  color: white;
  font-size: 28px;
  z-index: 20;
}

.dark .add-button {
  background: white;
  color: #111827;
}

.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 600px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: rgba(255,255,255,0.97);
  border-top: 1px solid #e5e7eb;
  padding: 8px 5px;
  z-index: 30;
}

.dark .bottom-nav {
  background: rgba(17,24,39,0.97);
  border-color: #374151;
}

.nav-btn {
  border: 0;
  background: transparent;
  color: #6b7280;
  padding: 7px 3px;
  font-size: 12px;
}

.nav-btn.active {
  color: #111827;
  font-weight: 800;
}

.dark .nav-btn.active {
  color: white;
}

.nav-icon {
  display: block;
  font-size: 21px;
  margin-bottom: 2px;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #e5e7eb;
}

.dark .setting-row {
  border-color: #374151;
}

.switch {
  width: 48px;
  height: 28px;
  border: 0;
  border-radius: 20px;
  background: #d1d5db;
  position: relative;
}

.switch span {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: white;
  top: 3px;
  left: 3px;
  transition: 0.2s;
}

.switch.on {
  background: #111827;
}

.switch.on span {
  left: 23px;
}
</style>
</head>

<body>

<div class="app">

  <!-- 首頁 -->
  <section id="homePage" class="page active">

    <div class="header">
      <h1>Salary+</h1>
      <p>你的澳洲工作與收入管理</p>
    </div>

    <div class="section">

      <div class="card">
        <div class="card-title">本月淨收入</div>

        <div id="homeNet" class="big-number">
          $0.00
        </div>

        <div id="homeNetText" class="small">
          收入 $0.00 · 支出 $0.00
        </div>
      </div>

      <div class="grid">

        <div class="stat">
          <div class="label">今日收入</div>
          <div id="todayIncome" class="value">$0</div>
        </div>

        <div class="stat">
          <div class="label">本週收入</div>
          <div id="weekIncome" class="value">$0</div>
        </div>

        <div class="stat">
          <div class="label">本月收入</div>
          <div id="monthIncome" class="value">$0</div>
        </div>

        <div class="stat">
          <div class="label">本月支出</div>
          <div id="monthExpense" class="value">$0</div>
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          💰 存錢目標
        </div>

        <div class="row">
          <strong id="goalName">
            尚未設定
          </strong>

          <strong id="goalPercent">
            0%
          </strong>
        </div>

        <div class="progress" style="margin-top:10px;">
          <div id="goalBar" class="progress-bar"></div>
        </div>

        <div id="goalText" class="small" style="margin-top:8px;">
          設定你的存錢目標
        </div>

        <button id="openGoalBtn" class="secondary" style="width:100%;margin-top:12px;">
          設定存錢目標
        </button>

      </div>

      <div class="card">

        <div class="card-title">
          ⚡ 快速操作
        </div>

        <button id="homeAddWorkBtn" class="primary">
          ➕ 新增工作
        </button>

        <button id="homeAddExpenseBtn" class="primary">
          🧾 新增支出
        </button>

      </div>

      <div class="card">

        <div class="card-title">
          🧮 簡易稅務估算
        </div>

        <div id="homeTax">
          年收入 $0.00
        </div>

      </div>

    </div>
  </section>


  <!-- 工作 -->
  <section id="workPage" class="page">

    <div class="header">
      <h1>💼 工作</h1>
      <p>管理工作與收入</p>
    </div>

    <div class="section">

      <div class="grid">

        <div class="stat">
          <div class="label">🤍 白工</div>
          <div id="whiteTotal" class="value">$0</div>
        </div>

        <div class="stat">
          <div class="label">💵 現金工作</div>
          <div id="cashTotal" class="value">$0</div>
        </div>

      </div>

      <div class="card">

        <div class="row">
          <strong>工作紀錄</strong>

          <button id="workAddBtn" class="secondary">
            ＋ 新增
          </button>
        </div>

        <div id="workList"></div>

      </div>

    </div>
  </section>


  <!-- 記帳 -->
  <section id="bookPage" class="page">

    <div class="header">
      <h1>🧾 記帳</h1>
      <p>管理生活支出</p>
    </div>

    <div class="section">

      <div class="grid">

        <div class="stat">
          <div class="label">本月收入</div>
          <div id="bookIncome" class="value positive">$0</div>
        </div>

        <div class="stat">
          <div class="label">本月支出</div>
          <div id="bookExpense" class="value negative">$0</div>
        </div>

      </div>

      <div class="card">

        <div class="row">
          <strong>支出紀錄</strong>

          <button id="expenseAddBtn" class="secondary">
            ＋ 新增
          </button>
        </div>

        <div id="expenseList"></div>

      </div>

    </div>
  </section>


  <!-- 統計 -->
  <section id="statsPage" class="page">

    <div class="header">
      <h1>📊 統計</h1>
      <p>工作與財務分析</p>
    </div>

    <div class="section">

      <div class="card">

        <div class="card-title">
          📅 本週
        </div>

        <div class="grid">

          <div>
            <div class="small">工作天數</div>
            <strong id="weekDays">0</strong>
          </div>

          <div>
            <div class="small">工作時數<
