<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary+</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  background: #111;
  padding-bottom: 90px;
}

header {
  padding: 25px 20px 15px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  color: #999;
  margin: 5px 0 0;
}

.section {
  display: none;
  padding: 10px 16px;
}

.section.active {
  display: block;
}

.card {
  background: #1d1d1f;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 14px;
}

.card h2,
.card h3 {
  margin-top: 0;
}

.income {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

.small {
  color: #999;
  font-size: 14px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: white;
  color: black;
  font-weight: bold;
}

.danger {
  background: #5a2020;
  color: white;
}

.secondary {
  background: #333;
  color: white;
}

.work-item,
.expense-item {
  background: #222;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 10px;
}

.money {
  font-size: 20px;
  font-weight: bold;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 430px;
  background: #1c1c1e;
  border-radius: 25px 25px 0 0;
  padding: 22px;
  max-height: 90vh;
  overflow-y: auto;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  color: #bbb;
}

input,
select,
textarea {
  width: 100%;
  background: #2c2c2e;
  border: 1px solid #444;
  color: white;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
}

textarea {
  min-height: 70px;
}

.form-buttons {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.form-buttons button {
  flex: 1;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  height: 72px;
  background: #1c1c1e;
  border-top: 1px solid #333;
  display: flex;
  z-index: 50;
}

.nav-btn {
  flex: 1;
  background: transparent;
  color: #888;
  border-radius: 0;
  padding: 8px 2px;
  font-size: 12px;
}

.nav-btn.active {
  color: white;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.tag {
  display: inline-block;
  background: #333;
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 12px;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Salary+</h1>
  <p>我的澳洲工作收入</p>
</header>

<!-- 首頁 -->
<div id="home" class="section active">

  <div class="card">
    <div class="small">今日收入</div>
    <div class="income" id="todayIncome">$0.00</div>
  </div>

  <div class="card">
    <div class="small">本週收入</div>
    <div class="income" id="weekIncome">$0.00</div>
  </div>

  <div class="card">
    <div class="small">本月收入</div>
    <div class="income" id="monthIncome">$0.00</div>
  </div>

  <div class="card">
    <div class="small">目前工作時數</div>
    <div class="income" id="totalHours">0 小時</div>
  </div>

  <div class="card">
    <h3>快速新增</h3>
    <button class="primary" onclick="openWorkModal()">
      📅 新增工作
    </button>
  </div>

</div>

<!-- 工作 -->
<div id="work" class="section">

  <div class="card">
    <div class="row">
      <div>
        <h2>工作紀錄</h2>
        <div class="small">記錄你的每一班工作</div>
      </div>
    </div>

    <button class="primary" onclick="openWorkModal()">
      ＋ 新增工作
    </button>
  </div>

  <div id="workList"></div>

</div>

<!-- 記帳 -->
<div id="bookkeeping" class="section">

  <div class="card">
    <h2>記帳</h2>

    <button class="primary" onclick="openExpenseModal()">
      ＋ 新增支出
    </button>
  </div>

  <div id="expenseList"></div>

</div>

<!-- 統計 -->
<div id="statistics" class="section">

  <div class="card">
    <h2>統計</h2>

    <p>總收入</p>
    <div class="income" id="statIncome">$0.00</div>

    <p>總支出</p>
    <div class="income" id="statExpense">$0.00</div>

    <p>收入 − 支出</p>
    <div class="income" id="statBalance">$0.00</div>
  </div>

</div>

<!-- 下方導航 -->
<div class="bottom-nav">

  <button class="nav-btn active" onclick="showSection('home', this)">
    <span class="nav-icon">🏠</span>
    首頁
  </button>

  <button class="nav-btn" onclick="showSection('work', this)">
    <span class="nav-icon">💼</span>
    工作
  </button>

  <button class="nav-btn" onclick="showSection('bookkeeping', this)">
    <span class="nav-icon">💰</span>
    記帳
  </button>

  <button class="nav-btn" onclick="showSection('statistics', this)">
    <span class="nav-icon">📊</span>
    統計
  </button>

</div>

</div>


<!-- 新增工作視窗 -->
<div id="workModal" class="modal">

  <div class="modal-box">

    <h2>新增工作</h2>

    <label>日期</label>
    <input type="date" id="workDate">

    <label>開始時間</label>
    <input type="time" id="startTime">

    <label>結束時間</label>
    <input type="time" id="endTime">

    <label>休息時間（分鐘）</label>
    <input type="number" id="breakMinutes" value="30">

    <label>時薪</label>
    <input type="number" id="hourlyRate" value="30">

    <label>工作類型</label>
    <select id="workType">
      <option value="white">🤍 白工</option>
      <option value="cash">💵 現金工作</option>
    </select>

    <label>備註</label>
    <textarea id="workNote" placeholder="例如：草莓工廠、包裝..."></textarea>

    <div class="form-buttons">
      <button class="secondary" onclick="closeWorkModal()">
        取消
      </button>

      <button class="primary" onclick="saveWork()">
        儲存
      </button>
    </div>

  </div>

</div>


<!-- 新增支出視窗 -->
<div id="expenseModal" class="modal">

  <div class="modal-box">

    <h2>新增支出</h2>

    <label>日期</label>
    <input type="date" id="expenseDate">

    <label>金額</label>
    <input type="number" id="expenseAmount" placeholder="例如 50">

    <label>類別</label>
    <select id="expenseCategory">
      <option>房租</option>
      <option>Gas</option>
      <option>Electricity</option>
      <option>Water</option>
      <option>Internet</option>
      <option>Fuel</option>
      <option>Car</option>
      <option>Food</option>
      <option>Entertainment</option>
      <option>Other</option>
    </select>

    <label>備註</label>
    <textarea id="expenseNote"></textarea>

    <div class="form-buttons">

      <button class="secondary" onclick="closeExpenseModal()">
        取消
      </button>

      <button class="primary" onclick="saveExpense()">
        儲存
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   資料
========================= */

let works = JSON.parse(
  localStorage.getItem("salaryWorks") || "[]"
);

let expenses = JSON.parse(
  localStorage.getItem("salaryExpenses") || "[]"
);


/* =========================
   導航
========================= */

function showSection(sectionId, button) {

  document.querySelectorAll(".section").forEach(function(section) {
    section.classList.remove("active");
  });

  document.getElementById(sectionId).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(function(btn) {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  renderAll();
}


/* =========================
   工作視窗
========================= */

function openWorkModal() {

  document.getElementById("workModal").classList.add("show");

  document.getElementById("workDate").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("startTime").value = "08:00";
  document.getElementById("endTime").value = "16:30";
  document.getElementById("breakMinutes").value = 30;
  document.getElementById("hourlyRate").value = 30;
  document.getElementById("workType").value = "white";
  document.getElementById("workNote").value = "";
}


function closeWorkModal() {

  document.getElementById("workModal").classList.remove("show");

}


/* =========================
   儲存工作
========================= */

function saveWork() {

  const date =
    document.getElementById("workDate").value;

  const start =
    document.getElementById("startTime").value;

  const end =
    document.getElementById("endTime").value;

  const breakMinutes =
    Number(document.getElementById("breakMinutes").value || 0);

  const rate =
    Number(document.getElementById("hourlyRate").value || 0);

  const type =
    document.getElementById("workType").value;

  const note =
    document.getElementById("workNote").value;


  if (!date || !start || !end || !rate) {

    alert("請把日期、時間和時薪填完整");

    return;
  }


  const startParts = start.split(":");
  const endParts = end.split(":");


  let startMinutes =
    Number(startParts[0]) * 60 +
    Number(startParts[1]);

  let endMinutes =
    Number(endParts[0]) * 60 +
    Number(endParts[1]);


  if (endMinutes <= startMinutes) {
    endMinutes += 24 * 60;
  }


  const totalMinutes =
    endMinutes -
    startMinutes -
    breakMinutes;


  if (totalMinutes <= 0) {

    alert("工作時間不正確");

    return;
  }


  const hours =
    totalMinutes / 60;

  const money =
    hours * rate;


  const work = {

    id: Date.now(),

    date: date,

    start: start,

    end: end,

    breakMinutes: breakMinutes,

    rate: rate,

    type: type,

    note: note,

    hours: hours,

    money: money

  };


  works.push(work);


  localStorage.setItem(
    "salaryWorks",
    JSON.stringify(works)
  );


  closeWorkModal();

  renderAll();

  alert(
    "✅ 工作已儲存\n\n" +
    "工作時間：" +
    hours.toFixed(2) +
    " 小時\n" +
    "收入：$" +
    money.toFixed(2)
  );
}

   刪除工作
========================= */
