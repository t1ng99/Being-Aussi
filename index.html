<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary+</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  color: #111;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px 16px 100px;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.amount {
  font-size: 32px;
  font-weight: 700;
  margin-top: 8px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  background: #007aff;
  color: white;
}

button:active {
  transform: scale(0.98);
}

.secondary {
  background: #e5e5ea;
  color: #111;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 12px;
  margin-top: 6px;
  margin-bottom: 12px;
  font-size: 16px;
}

label {
  font-size: 14px;
  color: #666;
}

.work-item {
  border-top: 1px solid #eee;
  padding: 15px 0;
}

.work-item:first-child {
  border-top: 0;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 600px;
  border-radius: 25px 25px 0 0;
  padding: 25px;
  max-height: 90vh;
  overflow-y: auto;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 75px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 50;
}

.nav button {
  background: none;
  color: #555;
  margin: 0;
  padding: 8px;
  font-size: 14px;
}

.nav button.active {
  color: #007aff;
}

.danger {
  background: #ff3b30;
}

.secondary-small {
  background: #e5e5ea;
  color: #111;
  padding: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>💰 Salary+</h1>
  <div class="subtitle">我的澳洲工作收入管理</div>

  <div id="homePage">

    <div class="card">
      <div>今日收入</div>
      <div class="amount" id="todayIncome">$0.00</div>
    </div>

    <div class="card">
      <div>本週收入</div>
      <div class="amount" id="weekIncome">$0.00</div>
    </div>

    <div class="card">
      <div>本月收入</div>
      <div class="amount" id="monthIncome">$0.00</div>
    </div>

    <div class="card">
      <h3>快速操作</h3>
      <button onclick="openWorkModal()">➕ 新增工作</button>
    </div>

  </div>

  <div id="workPage" style="display:none">

    <div class="card">
      <h2>💼 工作紀錄</h2>
      <button onclick="openWorkModal()">➕ 新增工作</button>
    </div>

    <div class="card">
      <div id="workList"></div>
    </div>

  </div>

</div>

<div class="nav">
  <button id="homeBtn" class="active" onclick="showPage('home')">
    🏠<br>首頁
  </button>

  <button id="workBtn" onclick="showPage('work')">
    💼<br>工作
  </button>
</div>

<div class="modal" id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">新增工作</h2>

    <label>日期</label>
    <input type="date" id="workDate">

    <label>開始時間</label>
    <input type="time" id="startTime">

    <label>結束時間</label>
    <input type="time" id="endTime">

    <label>休息時間（分鐘）</label>
    <input type="number" id="breakMinutes" value="30">

    <label>時薪</label>
    <input type="number" id="hourlyRate" value="30">

    <label>工作類型</label>
    <select id="workType">
      <option value="white">🤍 白工</option>
      <option value="cash">💵 現金工作</option>
    </select>

    <label>備註</label>
    <input type="text" id="note" placeholder="例如：花廠">

    <button onclick="saveWork()">💾 儲存</button>

    <button class="secondary" onclick="closeModal()">取消</button>

  </div>

</div>

<script>

let works = [];
let editingId = null;

function loadData() {

  const saved = localStorage.getItem("salaryWorks");

  if (saved) {
    works = JSON.parse(saved);
  }

}

function saveData() {

  localStorage.setItem(
    "salaryWorks",
    JSON.stringify(works)
  );

}

function showPage(page) {

  if (page === "home") {

    document.getElementById("homePage").style.display = "block";
    document.getElementById("workPage").style.display = "none";

    document.getElementById("homeBtn").classList.add("active");
    document.getElementById("workBtn").classList.remove("active");

  } else {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("workPage").style.display = "block";

    document.getElementById("homeBtn").classList.remove("active");
    document.getElementById("workBtn").classList.add("active");

    render();

  }

}

function openWorkModal() {

  editingId = null;

  document.getElementById("modalTitle").textContent = "新增工作";

  document.getElementById("workDate").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("startTime").value = "08:00";

  document.getElementById("endTime").value = "16:30";

  document.getElementById("breakMinutes").value = 30;

  document.getElementById("hourlyRate").value = 30;

  document.getElementById("workType").value = "white";

  document.getElementById("note").value = "";

  document.getElementById("modal").classList.add("show");

}

function closeModal() {

  document.getElementById("modal").classList.remove("show");

}

function saveWork() {

  const date =
    document.getElementById("workDate").value;

  const start =
    document.getElementById("startTime").value;

  const end =
    document.getElementById("endTime").value;

  const breakMinutes =
    Number(document.getElementById("breakMinutes").value) || 0;

  const hourlyRate =
    Number(document.getElementById("hourlyRate").value) || 0;

  const workType =
    document.getElementById("workType").value;

  const note =
    document.getElementById("note").value;

  if (!date || !start || !end) {

    alert("請填寫日期、開始和結束時間");

    return;

  }

  const startParts = start.split(":");
  const endParts = end.split(":");

  let startMinutes =
    Number(startParts[0]) * 60 +
    Number(startParts[1]);

  let endMinutes =
    Number(endParts[0]) * 60 +
    Number(endParts[1]);

  if (endMinutes <= startMinutes) {
    endMinutes += 24 * 60;
  }

  const totalMinutes =
    endMinutes -
    startMinutes -
    breakMinutes;

  const hours =
    Math.max(totalMinutes, 0) / 60;

  const income =
    hours * hourlyRate;

  if (editingId !== null) {

    const index =
      works.findIndex(function(item) {
        return item.id === editingId;
      });

    if (index !== -1) {

      works[index] = {
        id: editingId,
        date: date,
        start: start,
        end: end,
        breakMinutes: breakMinutes,
        hourlyRate: hourlyRate,
        workType: workType,
        note: note,
        hours: hours,
        income: income
      };

    }

  } else {

    works.push({

      id: Date.now(),

      date: date,
      start: start,
      end: end,
      breakMinutes: breakMinutes,
      hourlyRate: hourlyRate,
      workType: workType,
      note: note,
      hours: hours,
      income: income

    });

  }

  saveData();

  closeModal();

  render();

}

function editWork(id) {

  const work =
    works.find(function(item) {
      return item.id === id;
    });

  if (!work) {
    return;
  }

  editingId = id;

  document.getElementById("modalTitle").textContent =
    "編輯工作";

  document.getElementById("workDate").value =
    work.date;

  document.getElementById("startTime").value =
    work.start;

  document.getElementById("endTime").value =
    work.end;

  document.getElementById("breakMinutes").value =
    work.breakMinutes;

  document.getElementById("hourlyRate").value =
    work.hourlyRate;

  document.getElementById("workType").value =
    work.workType;

  document.getElementById("note").value =
    work.note || "";

  document.getElementById("modal").classList.add("show");

}

function deleteWork(id) {

  if (!confirm("確定要刪除這筆工作紀錄嗎？")) {
    return;
  }

  works =
    works.filter(function(item) {
      return item.id !== id;
    });

  saveData();

  render();

}

function render() {

  const list =
    document.getElementById("workList");

  if (works.length === 0) {

    list.innerHTML =
      "<p>目前沒有工作紀錄</p>";

  } else {

    const sorted =
      [...works].sort(function(a, b) {
        return b.date.localeCompare(a.date);
      });

    list.innerHTML =
      sorted.map(function(work) {

        return `
          <div class="work-item">

            <strong>${work.date}</strong>

            <div>
              ${work.start} - ${work.end}
            </div>

            <div>
              ${work.hours.toFixed(2)} 小時 ×
              $${work.hourlyRate.toFixed(2)}
            </div>

            <div>
              ${work.workType === "cash"
                ? "💵 現金工作"
                : "🤍 白工"}
            </div>

            <div>
              <strong>
                收入：$${work.income.toFixed(2)}
              </strong>
            </div>

            ${work.note
              ? <div>備註：${work.note}</div>
              : ""}

            <button
              class="secondary-small"
              onclick="editWork(${work.id})">
              ✏️ 編輯
            </button>

            <button
              class="danger"
              onclick="deleteWork(${work.id})">
              🗑 刪除
            </button>

          </div>
        `;

      }).join("");

  }

  updateDashboard();

}

function updateDashboard() {

  const today =
    new Date().toISOString().split("T")[0];

  const now =
    new Date();

  const day =
    now.getDay();

  const mondayOffset =
    day === 0 ? -6 : 1 - day;

  const monday =
    new Date(now);

  monday.setDate(
    now.getDate() + mondayOffset
