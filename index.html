<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Salary+</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  Roboto,"Noto Sans TC",Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

body.dark{
  background:#111827;
  color:#f9fafb;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.header{
  padding:24px 18px 10px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:5px 0 0;
  color:#6b7280;
}

.dark .header p{
  color:#9ca3af;
}

.section{
  padding:10px 16px;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.dark .card{
  background:#1f2937;
  box-shadow:none;
}

.card-title{
  font-size:15px;
  color:#6b7280;
  margin-bottom:8px;
}

.dark .card-title{
  color:#9ca3af;
}

.big-number{
  font-size:30px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat{
  background:white;
  border-radius:18px;
  padding:16px;
}

.dark .stat{
  background:#1f2937;
}

.stat .label{
  font-size:13px;
  color:#6b7280;
}

.dark .stat .label{
  color:#9ca3af;
}

.stat .value{
  font-size:22px;
  font-weight:800;
  margin-top:5px;
}

.primary{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  background:#111827;
  color:white;
  font-weight:700;
  margin-top:8px;
}

.primary:active{
  transform:scale(.98);
}

.secondary{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#e5e7eb;
  color:#111827;
  font-weight:600;
}

.dark .secondary{
  background:#374151;
  color:white;
}

.danger{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#fee2e2;
  color:#b91c1c;
  font-weight:600;
}

.add-button{
  position:fixed;
  right:20px;
  bottom:85px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:#111827;
  color:white;
  font-size:28px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
  z-index:20;
}

.dark .add-button{
  background:white;
  color:#111827;
}

.bottom-nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:600px;
  background:rgba(255,255,255,.96);
  border-top:1px solid #e5e7eb;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
  z-index:30;
}

.dark .bottom-nav{
  background:rgba(17,24,39,.97);
  border-color:#374151;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#6b7280;
  padding:7px 3px;
  font-size:12px;
}

.nav-btn.active{
  color:#111827;
  font-weight:800;
}

.dark .nav-btn.active{
  color:white;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.work-item,
.expense-item{
  border-bottom:1px solid #e5e7eb;
  padding:14px 0;
}

.dark .work-item,
.dark .expense-item{
  border-color:#374151;
}

.work-item:last-child,
.expense-item:last-child{
  border-bottom:0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.work-date{
  font-weight:800;
}

.work-sub{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.dark .work-sub{
  color:#9ca3af;
}

.amount{
  font-weight:800;
}

.white-work{
  color:#2563eb;
}

.cash-work{
  color:#16a34a;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  color:#6b7280;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:12px;
  background:white;
  color:#111827;
  outline:none;
}

.dark input,
.dark select,
.dark textarea{
  background:#111827;
  color:white;
  border-color:#4b5563;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow-y:auto;
  background:white;
  border-radius:24px 24px 0 0;
  padding:20px;
  padding-bottom:30px;
}

.dark .modal-box{
  background:#1f2937;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-header h2{
  margin:0;
}

.close{
  border:0;
  background:#e5e7eb;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.dark .close{
  background:#374151;
  color:white;
}

.progress{
  height:12px;
  border-radius:20px;
  background:#e5e7eb;
  overflow:hidden;
}

.dark .progress{
  background:#374151;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#111827;
  border-radius:20px;
}

.dark .progress-bar{
  background:white;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:25px 10px;
}

.money-positive{
  color:#16a34a;
}

.money-negative{
  color:#dc2626;
}

.small{
  font-size:12px;
  color:#6b7280;
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #e5e7eb;
}

.dark .setting-row{
  border-color:#374151;
}

.setting-row:last-child{
  border-bottom:0;
}

.switch{
  width:48px;
  height:28px;
  border-radius:20px;
  border:0;
  background:#d1d5db;
  position:relative;
}

.switch.on{
  background:#111827;
}

.switch span{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  top:3px;
  left:3px;
  transition:.2s;
}

.switch.on span{
  left:23px;
}

</style>

</head>

<body>

<div class="app">

  <!-- HOME -->

  <div id="homePage" class="page active">

    <div class="header">

      <h1>Salary+</h1>

      <p>你的澳洲工作與收入管理</p>

    </div>

    <div class="section">

      <div class="card">

        <div class="card-title">
          本月淨收入估算
        </div>

        <div
          class="big-number"
          id="homeMonthNet"
        >
          $0.00
        </div>

        <div
          class="small"
          id="homeMonthText"
        >
          收入 $0 · 支出 $0
        </div>

      </div>


      <div class="grid">

        <div class="stat">

          <div class="label">
            今日收入
          </div>

          <div
            class="value"
            id="todayIncome"
          >
            $0
          </div>

        </div>


        <div class="stat">

          <div class="label">
            本週收入
          </div>

          <div
            class="value"
            id="weekIncome"
          >
            $0
          </div>

        </div>


        <div class="stat">

          <div class="label">
            本月收入
          </div>

          <div
            class="value"
            id="monthIncome"
          >
            $0
          </div>

        </div>


        <div class="stat">

          <div class="label">
            本月支出
          </div>

          <div
            class="value"
            id="monthExpense"
          >
            $0
          </div>

        </div>

      </div>


      <div class="card">

        <div class="card-title">
          💰 存錢目標
        </div>

        <div
          class="row"
          style="margin-bottom:10px;"
        >

          <strong id="goalName">
            尚未設定目標
          </strong>

          <strong id="goalPercent">
            0%
          </strong>

        </div>

        <div class="progress">

          <div
            class="progress-bar"
            id="goalBar"
          ></div>

        </div>

        <div
          class="small"
          id="goalText"
          style="margin-top:8px;"
        >
          設定你的存錢目標
        </div>

        <button
          class="secondary"
          style="width:100%;margin-top:12px;"
          onclick="openGoal()"
        >
          設定存錢目標
        </button>

      </div>


      <div class="card">

        <div class="card-title">
          ⚡ 快速操作
        </div>

        <button
          class="primary"
          onclick="openWork()"
        >
          ➕ 新增工作
        </button>

        <button
          class="primary"
          onclick="openExpense()"
        >
          🧾 新增支出
        </button>

      </div>


      <div class="card">

        <div class="card-title">
          🧮 簡易稅務估算
        </div>

        <div
          id="taxSummary"
        >
          年收入 $0
        </div>

      </div>

    </div>

  </div>


  <!-- WORK -->

  <div id="workPage" class="page">

    <div class="header">

      <h1>💼 工作</h1>

      <p>管理你的工作與收入</p>

    </div>

    <div class="section">

      <div class="grid">

        <div class="stat">

          <div class="label">
            白工
          </div>

          <div
            class="value"
            id="whiteTotal"
          >
            $0
          </div>

        </div>


        <div class="stat">

          <div class="label">
            現金工作
          </div>

          <div
            class="value"
            id="cashTotal"
          >
            $0
          </div>

        </div>

      </div>


      <div class="card">

        <div class="row">

          <strong>
            工作紀錄
          </strong>

          <button
            class="secondary"
            onclick="openWork()"
          >
            ＋ 新增
          </button>

        </div>

        <div id="workList"></div>

      </div>

    </div>

  </div>


  <!-- BOOKKEEPING -->

  <div id="bookPage" class="page">

    <div class="header">

      <h1>🧾 記帳</h1>

      <p>收入與生活支出</p>

    </div>

    <div class="section">

      <div class="grid">

        <div class="stat">

          <div class="label">
            本月收入
          </div>

          <div
            class="value money-positive"
            id="bookIncome"
          >
