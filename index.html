<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Salary+</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111;
  padding-bottom:90px;
}

.header{
  background:#111;
  color:white;
  padding:45px 20px 28px;
  border-radius:0 0 28px 28px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{font-size:27px;font-weight:800}
.subtitle{font-size:13px;opacity:.6;margin-top:4px}
.settings{font-size:22px}

.main-pay{margin-top:28px}
.label{font-size:14px;opacity:.65;margin-bottom:7px}
.amount{font-size:42px;font-weight:800}
.tax-note{font-size:13px;opacity:.6;margin-top:7px}

.container{padding:20px}

.section-title{
  font-size:19px;
  font-weight:750;
  margin:8px 0 14px;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card-label{font-size:13px;color:#777;margin-bottom:8px}
.card-value{font-size:24px;font-weight:750}
.card-small{font-size:12px;color:#999;margin-top:6px}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.quick-button{
  border:0;
  background:white;
  border-radius:18px;
  padding:17px 8px;
  font-size:13px;
  font-weight:600;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.quick-icon{
  display:block;
  font-size:24px;
  margin-bottom:7px;
}

.progress-card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.progress{
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:35%;
  background:#111;
}

.goal-info{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:13px;
  color:#777;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #eee;
  z-index:10;
}

.nav-item{
  border:0;
  background:transparent;
  font-size:11px;
  color:#888;
  padding-top:10px;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#111;
  font-weight:700;
}

/* 新增工作視窗 */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:20;
  align-items:flex-end;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-height:92vh;
  overflow:auto;
  background:#f5f5f7;
  border-radius:28px 28px 0 0;
  padding:22px 20px 35px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:23px;
  font-weight:800;
}

.close{
  border:0;
  background:#ddd;
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:18px;
}

.form-group{margin-bottom:15px}

.form-group label{
  display:block;
  font-size:13px;
  color:#666;
  margin-bottom:7px;
}

input,select{
  width:100%;
  height:48px;
  border:0;
  border-radius:14px;
  padding:0 14px;
  font-size:16px;
  background:white;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type-button{
  height:48px;
  border:2px solid #ddd;
  background:white;
  border-radius:14px;
  font-weight:700;
}

.type-button.selected{
  border-color:#111;
  background:#111;
  color:white;
}

.calculate{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:18px 0;
}

.result-row{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}

.result-total{
  font-size:22px;
  font-weight:800;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.save-button{
  width:100%;
  height:52px;
  border:0;
  border-radius:17px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:750;
}

.work-list{
  margin-top:15px;
}

.work-item{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
}

.work-top{
  display:flex;
  justify-content:space-between;
  font-weight:700;
}

.work-detail{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

.work-money{
  margin-top:10px;
  font-size:18px;
  font-weight:750;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <div>
      <div class="logo">Salary+</div>
      <div class="subtitle">Australia Finance Manager</div>
    </div>
    <div class="settings">⚙️</div>
  </div>

  <div class="main-pay">
    <div class="label">本月收入</div>
    <div class="amount" id="monthIncome">$0</div>
    <div class="tax-note">稅前收入 · FY 2026–27</div>
  </div>
</header>

<main class="container">

<div class="section-title">收入概覽</div>

<div class="cards">

<div class="card">
  <div class="card-label">今日收入</div>
  <div class="card-value" id="todayIncome">$0</div>
  <div class="card-small">稅前</div>
</div>

<div class="card">
  <div class="card-label">本週收入</div>
  <div class="card-value" id="weekIncome">$0</div>
  <div class="card-small">稅前</div>
</div>

<div class="card">
  <div class="card-label">本月收入</div>
  <div class="card-value" id="monthIncome2">$0</div>
  <div class="card-small">稅前</div>
</div>

<div class="card">
  <div class="card-label">工作天數</div>
  <div class="card-value" id="workDays">0</div>
  <div class="card-small">本月</div>
</div>

</div>

<div class="section-title" style="margin-top:28px">
快速新增
</div>

<div class="quick">

<button class="quick-button" onclick="openModal()">
<span class="quick-icon">📅</span>
新增工作
</button>

<button class="quick-button">
<span class="quick-icon">💰</span>
新增收入
</button>

<button class="quick-button">
<span class="quick-icon">🧾</span>
新增支出
</button>

</div>

<div class="section-title" style="margin-top:28px">
最近工作
</div>

<div id="workList" class="work-list">
<div class="card-small">目前還沒有工作紀錄</div>
</div>

<div class="section-title" style="margin-top:28px">
存錢目標
</div>

<div class="progress-card">
<div class="progress-top">
<strong>🎯 我的目標</strong>
<strong>0%</strong>
</div>

<div class="progress">
<div class="progress-bar" style="width:0%"></div>
</div>

<div class="goal-info">
<span>$0 / $20,000</span>
<span>尚未設定</span>
</div>
</div>

</main>

<nav class="nav">

<button class="nav-item active">
<span class="nav-icon">🏠</span>
首頁
</button>

<button class="nav-item">
<span class="nav-icon">📅</span>
排班
</button>

<button class="nav-item">
<span class="nav-icon">🧾</span>
記帳
</button>

<button class="nav-item">
<span class="nav-icon">📊</span>
統計
</button>

</nav>

<!-- 新增工作視窗 -->

<div class="modal" id="workModal">

<div class="modal-box">

<div class="modal-header">
<div class="modal-title">新增工作</div>
<button class="close" onclick="closeModal()">×</button>
</div>

<div class="form-group">
<label>日期</label>
<input type="date" id="workDate">
</div>

<div class="row">

<div class="form-group">
<label>開始時間</label>
<input type="time" id="startTime">
</div>

<div class="form-group">
<label>結束時間</label>
<input type="time" id="endTime">
</div>

</div>

<div class="form-group">
<label>休息時間（分鐘）</label>
<input type="number" id="breakTime" value="30" min="0">
</div>

<div class="form-group">
<label>工作類型</label>

<div class="type-buttons">

<button class="type-button selected" id="whiteButton" onclick="selectType('white')">
白工
</button>

<button class="type-button" id="cashButton" onclick="selectType('cash')">
Cash
</button>

</div>
</div>

<div class="row">

<div class="form-group">
<label>時薪 AUD</label>
<input type="number" id="hourlyRate" value="30" min="0" step="0.01">
</div>

<div class="form-group">
<label>加班倍率</label>
<select id="overtime">
<option value="1">1.0 ×</option>
<option value="1.5">1.5 ×</option>
<option value="2">2.0 ×</option>
</select>
</div>

</div>

<div class="form-group">
<label>備註</label>
<input type="text" id="note" placeholder="例如：花廠、包裝">
</div>

<div class="calculate">

<div class="result-row">
<span>工作時間</span>
<strong id="hoursResult">0 小時</strong>
</div>

<div class="result-row">
<span>稅前收入</span>
<strong id="grossResult">$0</strong>
</div>

<div class="result-row">
<span>預估稅</span>
<strong id="taxResult">$0</strong>
</div>

<div class="result-row result-total">
<span>稅後收入</span>
<strong id="netResult">$0</strong>
</div>

</div>

<button class="save-button" onclick="saveWork()">
儲存工作紀錄
</button>

</div>
</div>

let workType="white";

  document.getElementById("workModal").classList.add("show");

  document.getElementById("workDate").value=today;

  calculate();
}

function closeModal(){
  document.getElementById("workModal").classList.remove("show");
}

  workType=type;

  document.getElementById("whiteButton").classList.toggle("selected",type==="white");
  document.getElementById("cashButton").classList.toggle("selected",type==="cash");

  calculate();
}
