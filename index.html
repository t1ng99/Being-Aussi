<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary+</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 30px 20px;
    }

    .header {
      background: #111;
      color: white;
      padding: 30px 20px;
      border-radius: 25px;
    }

    h1 {
      margin: 0;
    }

    .card {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #111;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Salary+</h1>
    <p>Australia Finance Manager</p>
  </div>

  <div class="card">
    <h2>收入概覽</h2>
    <p>今日收入：<strong>$0</strong></p>
    <p>本週收入：<strong>$0</strong></p>
    <p>本月收入：<strong>$0</strong></p>
  </div>

  <div class="card">
    <h2>快速新增</h2>

    <button onclick="testButton()">
      📅 新增工作
    </button>

    <div id="message"></div>
  </div>

  <script>
    function testButton() {
      document.getElementById("message").innerText =
        "✅ 按鈕成功運作！";
    }
  </script>

</body>
</html>
